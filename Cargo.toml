[package]
name = "kinetix"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
authors = ["Kinetix Developers"]
description = "Zero-installation, transient automatic tiling engine for X11 and Wayland (KWin)"

[dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xkb", "shape"] }
zbus = { version = "4.0", features = ["tokio"] }
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
simplelog = "0.12"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
async-trait = "0.1"
